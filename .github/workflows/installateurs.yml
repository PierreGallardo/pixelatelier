# Construit les installateurs Windows (.exe) et macOS (.dmg Apple Silicon et Intel)
# sur les machines de GitHub.
#
# - Lancement manuel : onglet « Actions » > « Installateurs » > « Run workflow ».
#   Les fichiers sont ensuite téléchargeables en bas de la page de l'exécution (« Artifacts »).
# - Publication : pousser une étiquette de version (ex. `git tag v0.1.0 && git push --tags`)
#   crée une « Release » GitHub contenant les installateurs.
name: Installateurs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: pixelatelier-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installateurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: installateurs/*
